<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="RustとWebAssemblyで動作する二重振り子シミュレーター"
    />
    <title>Double Pendulum Lab</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">RUST × WEBASSEMBLY</p>
        <h1>Double Pendulum Lab</h1>
        <p class="subtitle">理想的な二重振り子が描く、予測不能な軌道。</p>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="status-text">読み込み中</span>
      </div>
    </header>

    <main>
      <section class="control-panel" aria-labelledby="settings-heading">
        <div class="section-heading">
          <div>
            <p class="section-number">01</p>
            <h2 id="settings-heading">初期条件</h2>
          </div>
          <p>角度は真下を0°とした絶対角です</p>
        </div>

        <form id="settings-form">
          <fieldset>
            <legend>質量</legend>
            <label>
              <span><i class="swatch swatch-m1"></i>m1</span>
              <span class="input-wrap">
                <input id="m1" name="m1" type="number" min="0.01" step="0.01" value="1" required />
                <b>kg</b>
              </span>
            </label>
            <label>
              <span><i class="swatch swatch-m2"></i>m2</span>
              <span class="input-wrap">
                <input id="m2" name="m2" type="number" min="0.01" step="0.01" value="1" required />
                <b>kg</b>
              </span>
            </label>
          </fieldset>

          <fieldset>
            <legend>腕の長さ</legend>
            <label>
              <span>l1</span>
              <span class="input-wrap">
                <input id="l1" name="l1" type="number" min="0.01" step="0.01" value="1" required />
                <b>m</b>
              </span>
            </label>
            <label>
              <span>l2</span>
              <span class="input-wrap">
                <input id="l2" name="l2" type="number" min="0.01" step="0.01" value="1" required />
                <b>m</b>
              </span>
            </label>
          </fieldset>

          <fieldset>
            <legend>初期角度</legend>
            <label>
              <span>θ1</span>
              <span class="input-wrap">
                <input id="theta1" name="theta1" type="number" step="1" value="120" required />
                <b>°</b>
              </span>
            </label>
            <label>
              <span>θ2</span>
              <span class="input-wrap">
                <input id="theta2" name="theta2" type="number" step="1" value="-10" required />
                <b>°</b>
              </span>
            </label>
          </fieldset>

          <div class="actions">
            <button class="primary" id="start-button" type="submit" disabled>
              <span class="play-icon">▶</span>スタート
            </button>
            <button id="pause-button" type="button" disabled>一時停止</button>
            <button id="reset-button" type="button" disabled>リセット</button>
          </div>
        </form>
      </section>

      <section class="visual-panel" aria-labelledby="simulation-heading">
        <div class="section-heading compact">
          <div>
            <p class="section-number">02</p>
            <h2 id="simulation-heading">シミュレーション</h2>
          </div>
          <p class="time-readout"><span id="time-value">0.00</span> s</p>
        </div>
        <div class="canvas-shell simulation-shell">
          <canvas id="pendulum-canvas" aria-label="二重振り子のアニメーション"></canvas>
          <p class="canvas-hint">m2の軌跡：新しいほど明るく表示</p>
        </div>
      </section>

      <section class="chart-panel" aria-labelledby="energy-heading">
        <div class="section-heading compact">
          <div>
            <p class="section-number">03</p>
            <h2 id="energy-heading">エネルギー</h2>
          </div>
          <div class="legend" aria-label="グラフの凡例">
            <span><i class="line-key key-e1"></i>m1</span>
            <span><i class="line-key key-e2"></i>m2</span>
            <span><i class="line-key key-total"></i>合計</span>
          </div>
        </div>
        <div class="canvas-shell chart-shell">
          <canvas id="energy-canvas" aria-label="エネルギーの時系列グラフ"></canvas>
        </div>
      </section>
    </main>

    <footer>
      <p>摩擦・空気抵抗なし · RK4 Δt = 1/240 s · g = 9.80665 m/s²</p>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
